# GitHub sunucularında APK derler ve "Releases" bölümüne yükler.
# Depoya her gönderimde veya Actions sekmesinden "Run workflow" ile elle çalışır.
name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Android projesini oluştur
        run: npx expo prebuild --platform android --no-install

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk Meydan-demo.apk

      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-${{ github.run_number }}
          name: Meydan demo ${{ github.run_number }}
          body: Telefondan "Meydan-demo.apk" dosyasına dokunarak indirip kurabilirsiniz.
          files: Meydan-demo.apk
